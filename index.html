
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUNGERS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #c1ff72; /* Fondo oficial Hungers */
            color: #1a3a1a; /* Verde oscuro para texto */
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #root { 
            height: 100%; 
            width: 100%; 
            background-color: transparent; 
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #88d43d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #1a3a1a; }
        
        .pipeline-chevron {
            clip-path: polygon(0% 0%, 93% 0%, 100% 50%, 93% 100%, 0% 100%, 7% 50%);
        }
        .pipeline-chevron:first-child { clip-path: polygon(0% 0%, 93% 0%, 100% 50%, 93% 100%, 0% 100%); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1ff72; border-radius: 10px; }
    </style>
    <script>
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hungers: '#c1ff72',
                        'hungers-dark': '#1a3a1a', 
                        'hungers-medium': '#88d43d',
                        'hungers-soft': '#f1ffde'
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '3rem'
                    }
                }
            }
        }
    </script>
<script type="importmap">

    "recharts": "https://esm.sh/recharts@^3.6.0",

  }
}
</script>

</head>

</body>
</html>
